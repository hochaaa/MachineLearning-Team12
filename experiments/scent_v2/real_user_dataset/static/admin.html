<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCENT MATCH · 로컬 관리자</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head><body><header><a class="wordmark" href="/">SCENT MATCH<span>OPERATOR / LOCAL ONLY</span></a><span class="tag">집계 현황</span></header><main><section class="hero"><p class="eyebrow">COLLECTION STATUS</p><h1>데이터 수집 현황</h1><p>개별 사용자 평점·독립 평가 정답을 표시하지 않습니다.</p></section><section id="login" class="panel"><h2>운영자 로그인</h2><p class="muted">로컬 data/.admin_token 파일의 관리자 코드를 입력하세요. 코드나 파일을 공유·업로드하지 마세요.</p><label for="code">관리자 코드</label><input id="code" type="password" autocomplete="off"><button id="signin">로그인</button></section><section id="dashboard" class="panel" hidden><h2>집계 현황</h2><div id="stats"></div><h3>개발용 평점 분포</h3><div id="histogram"></div><p class="muted">독립 평가용은 건수·평가 가능 인원만 집계합니다. 평점 값·평균·분포는 개발 화면에 노출하지 않습니다.</p><button id="refresh">새로고침</button> <button id="logout" class="secondary">로그아웃</button></section><div id="status" role="status"></div></main></body></html>
